allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Some legacy Flutter plugins predate AGP's mandatory namespace DSL.
subprojects { project ->
    project.plugins.withId('com.android.library') {
        project.androidComponents.finalizeDsl { androidDsl ->
            androidDsl.compileSdk = 36
        }
        if (project.file('src/main/kotlin').exists() &&
                !project.plugins.hasPlugin('org.jetbrains.kotlin.android')) {
            project.pluginManager.apply('org.jetbrains.kotlin.android')
            project.kotlin {
                compilerOptions {
                    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                }
            }
        }
        if (project.android.namespace == null) {
            def manifestFile = project.file('src/main/AndroidManifest.xml')
            def packageName = null
            if (manifestFile.exists()) {
                def packageMatcher = manifestFile.getText('UTF-8') =~ /package\s*=\s*["']([^"']+)["']/
                if (packageMatcher.find()) {
                    packageName = packageMatcher.group(1)
                }
            }
            project.android.namespace = packageName ?: "com.example.${project.name.replace('-', '_')}"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
